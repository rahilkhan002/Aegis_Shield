# =============================================================================
# deployment.yaml — Kubernetes Manifests for the Fraud Detection API
#
# Resources declared (in order):
#   1. Namespace          — isolates all pipeline resources
#   2. Deployment         — 2 replicas, resource limits, probes
#   3. Service            — NodePort exposure for Minikube access
#   4. HorizontalPodAutoscaler — scales 2→5 replicas on CPU load
#
# Apply with:
#   kubectl apply -f deployment.yaml
#
# Verify with:
#   kubectl -n mlops get all
#   minikube service fraud-detection-svc -n mlops --url
# =============================================================================

# ── 1. Namespace ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: mlops
  labels:
    app.kubernetes.io/managed-by: kubectl
    project: fraud-detection-pipeline

---

# ── 2. Deployment ────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-detection-deployment
  namespace: mlops
  labels:
    app: fraud-detection
    version: "1.0.0"
    component: api
spec:
  # Two replicas provides baseline high-availability; the HPA below will
  # scale beyond this based on CPU utilisation.
  replicas: 2

  selector:
    matchLabels:
      app: fraud-detection

  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Allow one extra pod during a rollout (zero-downtime deployments)
      maxSurge: 1
      # Never take more than 0 pods offline simultaneously
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: fraud-detection
        version: "1.0.0"
      annotations:
        # Prometheus auto-discovery annotations — used if the Prometheus
        # Kubernetes SD config is set up (works alongside the static config).
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      # Security context applied to all containers in the pod
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001

      # Ensure Kubernetes waits for the pod to be fully ready before
      # terminating the old pods during a rolling update.
      terminationGracePeriodSeconds: 30

      containers:
        - name: fraud-detection-api
          # In a real pipeline, this tag is replaced by the Jenkins build
          # step with the exact Docker image digest:
          #   image: localhost:5000/fraud-detection-api:<BUILD_NUMBER>
          image: fraud-detection-api:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          # Environment variables injected at runtime
          env:
            - name: MODEL_VERSION
              value: "1.0.0"
            - name: MODEL_DIR
              value: "/app"
            # Expose pod identity for structured logging
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

          # ── Resource Governance ────────────────────────────────────────────
          resources:
            requests:
              # Minimum guaranteed resources — sized for inference workload
              cpu: "250m"       # 0.25 vCPU
              memory: "256Mi"
            limits:
              # Hard ceiling — prevents one noisy pod from starving others
              cpu: "500m"       # 0.5 vCPU
              memory: "512Mi"

          # ── Liveness Probe ─────────────────────────────────────────────────
          # Kubernetes restarts the container if this probe fails, providing
          # automatic self-healing for deadlocks or model load failures.
          livenessProbe:
            httpGet:
              path: /
              port: http
            # Allow enough time for Uvicorn + model loading on first start
            initialDelaySeconds: 25
            periodSeconds: 15
            timeoutSeconds: 5
            # Restart after 3 consecutive failures
            failureThreshold: 3
            successThreshold: 1

          # ── Readiness Probe ────────────────────────────────────────────────
          # Traffic is only routed to a pod once this probe succeeds, ensuring
          # users are never sent to a pod that hasn't finished initialising.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          # ── Container Security Context ─────────────────────────────────────
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # Uvicorn needs to write temp files
            capabilities:
              drop:
                - ALL

---

# ── 3. Service ───────────────────────────────────────────────────────────────
# NodePort exposes the service on a stable port on every Minikube node IP,
# making it directly accessible from the Windows host via:
#   http://$(minikube ip):30800
apiVersion: v1
kind: Service
metadata:
  name: fraud-detection-svc
  namespace: mlops
  labels:
    app: fraud-detection
    component: api
spec:
  type: NodePort
  selector:
    app: fraud-detection
  ports:
    - name: http
      protocol: TCP
      # Port exposed on the Service (cluster-internal)
      port: 80
      # Port on the container (must match containerPort above)
      targetPort: http
      # Fixed NodePort — consistent across restarts; avoids ephemeral port
      # surprise in demo / development environments.
      # Accessible at: http://<minikube-ip>:30800
      nodePort: 30800

---

# ── 4. HorizontalPodAutoscaler ───────────────────────────────────────────────
# Scales the Deployment between 2 and 5 replicas when average CPU across
# all pods exceeds 70% of their requested CPU (250m).
# Prerequisite: metrics-server must be enabled in Minikube:
#   minikube addons enable metrics-server
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fraud-detection-hpa
  namespace: mlops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fraud-detection-deployment
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 180
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
